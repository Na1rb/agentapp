server:
  port: 8080
  servlet:
    context-path: /

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ai130

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # AI 配置 - 阿里云通义千问
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:sk-91095327a55f47d3910312df3cb90773}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3

  deepseek:
    openai:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:sk-9c459ea33a174d6b856a38ad37f5ebf7}
      chat:
        options:
          model: deepseek-chat

  # PostgreSQL 配置
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6000ms

# 日志配置
logging:
  level:
    root: info
    com.itheima.ai: debug
    org.springframework.ai: debug
